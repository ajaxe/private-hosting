server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html index.htm;

    # Performance tweaks for static file serving behind Traefik
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;

    # Traefik handles external access; allow internal health/probes
    location / {
        try_files $uri $uri/ =404;
    }

    # Hide Nginx version banner for security
    server_tokens off;

    # Error handling
    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
        root /usr/share/nginx/html;
    }
}