include:
  - path: ../compose.networks.yml
services:
  loki:
    container_name: loki
    image: grafana/loki:3.4.4
    extends:
      file: ../compose.base.yml
      service: x-base-service
    profiles:
      - observability
    user: 0:0
    ports:
      - "0.0.0.0:3100:3100"
    volumes:
      - ./config/loki-config.yaml:/etc/loki/loki-config.yaml
      - ${HOSTING_DIR}/loki/data:/data/loki
    command: -config.file=/etc/loki/loki-config.yaml
    deploy:
      resources:
        limits:
          # Adjust these values based on your host's capacity
          memory: 2g
    labels:
      - traefik.enable=true
      - traefik.http.routers.loki-push.entrypoints=websecured
      - traefik.http.routers.loki-push.rule=Host(`loki.apogee-dev.com`) && PathPrefix(`/loki/api/v1/push`)
      - traefik.http.routers.loki-push.tls=true
      - traefik.http.routers.loki-push.tls.certresolver=default
      - traefik.http.routers.loki-push.tls.domains[0].main=*.apogee-dev.com
      - traefik.http.routers.loki-push.tls.domains[0].sans=apogee-dev.com
      - traefik.http.routers.loki-push.middlewares=loki-auth

      - "traefik.http.middlewares.loki-auth.basicauth.usersFile=/htpasswd.loki"
      - "traefik.http.middlewares.loki-auth.basicauth.removeHeader=true"

      - traefik.http.services.loki-push.loadbalancer.server.port=3100
    healthcheck:
      # Loki's health check endpoint is /ready
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3100/ready"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  promtail:
    image: grafana/promtail:latest
    extends:
      file: ../compose.base.yml
      service: x-base-service
    profiles:
      - observability
    volumes:
      - ./config/promtail-config.yaml:/etc/promtail/config.yml
      - /var/run/docker.sock:/var/run/docker.sock
      - /var/lib/docker/containers:/var/lib/docker/containers
      - ${HOSTING_DIR}/loki/promtail-data:/run/promtail
    command: -config.file=/etc/promtail/config.yml
    ports:
      - "9080:9080"
