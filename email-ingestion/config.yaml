environment: dev
log_level: "debug"
server:
  port: 8080
database:
  dsn: ""
  redis: ""

smtp:
  listen_address:
  domain:
  email_size_max_mb: 25
  max_line_length: 2048
  email_domain:
  read_timeout_seconds: 10
  write_timeout_seconds: 10
  api_url:
  mta_auth_token:

storage:
  aws_region: "us-east-1" # AWS region where the S3 bucket is located
  s3_base_endpoint:
  use_path_style: true # Use path-style addressing for S3 (true for MinIO, false for AWS S3), not used if s3_base_endpoint is empty.
  s3_bucket:
  ingestion_prefix: "tmp/" # S3 prefix for storing raw email files before they are processed
  storage_prefix: "storage/" # S3 prefix for storing processed email files after, converting the raw EML to a json file exclding the attachments.
  presign_url_ttl_minutes: 15

webhook:
  allowed_domains: # override them via env vars with space separated values
    - "localhost"
    - "internal.some-domain.com"

auth:
  provider: "oidc"
  admin: # Admin user credentials for local password auth. Not used if auth.provider is set to "oidc".
    username:
    password:
    jwt_secret:
    authority:
    token_ttl_minutes: 1440
  oidc:
    authority: https://idsrv-1.apogee-dev.com/
    client_id: 7ca8b353-d2ed-42ce-abc6-8d32c5bfd4d5
    jwks_uri: https://idsrv-1.apogee-dev.com/.well-known/jwks
